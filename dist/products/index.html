  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      cursor: default;
    }

    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .fade-in-up {
      animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    .fade-in-up-delay {
      animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    .fade-in-up-delay-2 {
      animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-pulse-slow {
      animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.1;
      }

      50% {
        opacity: 0.2;
      }
    }

    @keyframes blob {
      0% {
        transform: translate(0px, 0px) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0px, 0px) scale(1);
      }
    }

    .animate-blob {
      animation: blob 10s infinite;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }

    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-logo-reveal {
      animation: logoReveal 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes shine {
      100% {
        left: 125%;
      }
    }

    .animate-shine {
      animation: shine 1s;
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
    }

    @keyframes ripple {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }

      100% {
        transform: translate(-50%, -50%) scale(4);
        opacity: 0;
      }
    }

    .animate-ripple {
      animation: ripple 0.8s ease-out forwards;
    }

    /* New animations for improved PuzzleJoin */
    .perspective-1000 {
      perspective: 1000px;
    }
  </style>
